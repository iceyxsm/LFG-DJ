[package]
name = "lfg-dj"
version = "0.1.0"
description = "Fullscreen generative reactive DJ visuals driven by Spotify playback + synced lyrics"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lfg_dj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
